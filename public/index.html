<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Better Bites</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Better <span class="accent">Bites</span></div>
  </header>

  <main id="app">

    <!-- SEARCH TAB (home) -->
    <section class="tab-panel active" id="tab-search">
      <div class="suggestion-banner" id="suggestionBanner">
        <div class="suggestion-header">
          <span>Tonight's suggestion</span>
          <button id="refreshSuggestion" class="link-btn">refresh</button>
        </div>
        <div id="suggestionContent" class="suggestion-body">
          <button id="loadSuggestion" class="btn primary small">What should we eat tonight?</button>
        </div>
      </div>

      <form id="searchForm" class="search-row">
        <input id="searchInput" type="text" placeholder="What do you have or want to eat?" />
        <button type="submit" class="btn primary">Search</button>
      </form>
      <div id="searchResults" class="card-grid"></div>
    </section>

    <!-- DISCOVER TAB (swipe) -->
    <section class="tab-panel" id="tab-discover">
      <div class="page-title-row">
        <div class="page-title">Discover</div>
        <button id="loadNinjaCombi" class="btn secondary small" title="Search the web for real Ninja Combi recipes">🔍 Real Ninja Combi recipes</button>
      </div>
      <div class="swipe-stage" id="swipeStage">
        <div class="swipe-empty" id="swipeEmpty">
          <p>Load some recipes to start swiping.</p>
          <button id="loadFeed" class="btn primary">Load recipes</button>
        </div>
      </div>
      <div class="swipe-controls" id="swipeControls" style="display:none;">
        <button id="swipeNo" class="round-btn no" title="Not interested">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button id="swipePlus" class="round-btn plus" title="Add to plan / recipe book">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="swipeYes" class="round-btn yes" title="Like">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.1C.4 8.6 2 5 5.6 5c2 0 3.4 1 4.4 2.4C11 6 12.4 5 14.4 5 18 5 19.6 8.6 22 11.9 19.5 16.4 12 21 12 21z"/></svg>
        </button>
      </div>
    </section>

    <!-- CALENDAR TAB -->
    <section class="tab-panel" id="tab-calendar">
      <div class="page-title">Calendar</div>
      <div class="calendar-header">
        <button id="prevWeek" class="btn small ghost">◀ Prev</button>
        <div id="weekLabel" class="week-label"></div>
        <button id="nextWeek" class="btn small ghost">Next ▶</button>
      </div>
      <div class="week-grid" id="weekGrid"></div>
    </section>

    <!-- SNACKS TAB -->
    <section class="tab-panel" id="tab-snacks">
      <div class="page-title">Snacks</div>
      <form id="snackForm" class="search-row">
        <input id="snackInput" type="text" placeholder="Craving something specific? (optional)" />
        <button type="submit" class="btn primary">Get ideas</button>
      </form>
      <div id="snackResults" class="card-grid"></div>
    </section>

    <!-- COOKBOOK TAB (saved recipes + pantry) -->
    <section class="tab-panel" id="tab-cookbook">
      <div class="page-title">Cookbook</div>

      <div class="segmented" id="cookbookToggle">
        <button class="segmented-btn active" data-view="recipes">My Recipes</button>
        <button class="segmented-btn" data-view="pantry">Pantry</button>
      </div>

      <div class="cookbook-view active" id="cookbookRecipesView">
        <div id="cookbookRecipes" class="card-grid"></div>
      </div>

      <div class="cookbook-view" id="cookbookPantryView">
        <form id="pantryForm" class="pantry-form">
          <input id="pantryItem" type="text" placeholder="Item (e.g. chicken thighs)" required />
          <input id="pantryQty" type="text" placeholder="Qty" />
          <input id="pantryUnit" type="text" placeholder="Unit" />
          <input id="pantryCategory" type="text" placeholder="Category" />
          <input id="pantryLocation" type="text" placeholder="Location" />
          <button type="submit" class="btn primary">Add</button>
        </form>
        <div id="pantryList" class="pantry-list"></div>
      </div>
    </section>

  </main>

  <!-- Add-to-plan / save modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">Save recipe</h3>
      <p class="modal-sub" id="modalSub">Add to a day this week, or just save it to your recipe book.</p>
      <div class="modal-days" id="modalDays"></div>
      <button id="modalSaveOnly" class="btn secondary full">Save to recipe book only</button>
      <button id="modalClose" class="btn ghost full">Cancel</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Bottom navigation -->
  <nav class="bottom-nav" id="mainTabs">
    <button class="nav-btn active" data-tab="search">
      <span class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
      Search
    </button>
    <button class="nav-btn" data-tab="discover">
      <span class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-10-9.1C.4 8.6 2 5 5.6 5c2 0 3.4 1 4.4 2.4C11 6 12.4 5 14.4 5 18 5 19.6 8.6 22 11.9 19.5 16.4 12 21 12 21z"/></svg></span>
      Discover
    </button>
    <button class="nav-btn" data-tab="calendar">
      <span class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
      Calendar
    </button>
    <button class="nav-btn" data-tab="snacks">
      <span class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="14" cy="9" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="14" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="14" r="1" fill="currentColor" stroke="none"/></svg></span>
      Snacks
    </button>
    <button class="nav-btn" data-tab="cookbook">
      <span class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
      Cookbook
    </button>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
